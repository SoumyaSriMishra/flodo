name: flodo
description: FLODO - Smart Task Manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  flutter_slidable: ^3.0.1
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
  image: ^4.8.0
  flutter_native_splash: ^2.4.7

flutter_icons:
  android: true
  web:
    generate: true
  ios: true
  image_path: "assets/icon/app_icon_padded.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0F"
  adaptive_icon_foreground: "assets/icon/app_icon_padded.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/icon/app_icon_padded.png"
  android_12:
    color: "#000000"
    image: "assets/icon/app_icon_padded.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
